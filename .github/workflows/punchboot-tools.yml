name: Build punchboot-tools
on: [pull_request, push, workflow_dispatch]

# The punchboot package is pure Python: one wheel for every platform. USB goes
# through pyusb, with libusb from the libusb-package wheels.

jobs:
  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: pipx run build

      - uses: actions/upload-artifact@v7
        with:
          name: punchboot-tools
          path: dist/*

  smoke_test:
    name: Test the wheel on ${{ matrix.os }}, Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: punchboot-tools
          path: dist

      - name: Install and run
        shell: bash
        run: |
          python -m pip install dist/*.whl
          punchboot --version
          # libusb loads, and listing devices works without any attached
          python -c "import libusb_package; assert libusb_package.get_libusb1_backend()"
          python -c "import punchboot; assert punchboot.list_usb_devices() == []"

  upload_pypi_test:
    name: Upload to PyPi (Test)
    needs: [build, smoke_test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.repository == 'jonasblixt/punchboot' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: punchboot-tools
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          packages-dir: dist/

  upload_pypi:
    name: Upload to PyPi
    needs: [build, smoke_test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.repository == 'jonasblixt/punchboot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: punchboot-tools
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/
