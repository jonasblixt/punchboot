name: Punchboot build

on: [push, pull_request]

# Everything runs in the dev container (docker/Dockerfile) through
# scripts/pbdev, the same way as locally. See doc/dev/testing.md.

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cmake_args: ""
          - name: sanitizers
            cmake_args: "-DPB_SANITIZE=ON"
    steps:
      - uses: actions/checkout@v4

      - name: Unit and integration tests
        run: scripts/pbdev test ${{ matrix.cmake_args }}

  compat:
    name: Compatibility (frozen values and golden images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every value frozen at the branch point must still be there (D-008).
      # compat.abi in the host tests checks that abi.txt matches the code.
      - name: Check abi.txt, the golden bpak images and the transcripts against the base branch
        env:
          BASE: ${{ github.base_ref || 'master' }}
        run: |
          base="$(git merge-base HEAD "origin/$BASE")"
          python3 tests/compat/check_abi.py history tests/compat/abi.txt --against "$base"
          python3 tests/compat/check_abi.py history tests/compat/bpak/SHA256SUMS --against "$base"
          changed="$(git diff --name-only --diff-filter=DMRT "$base" -- \
            'tests/compat/bpak/*.bpak' 'tests/compat/transcripts/*.txt')"
          if [ -n "$changed" ]; then
            echo "Golden bpak images and wire transcripts are never changed or removed (D-008):"
            echo "$changed"
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tests with coverage
        run: BUILD_DIR=build-host-cov scripts/pbdev test -DPB_COVERAGE=ON

      - name: Coverage report
        run: |
          mkdir -p coverage
          scripts/pbdev run gcovr -r . build-host-cov --filter src/ \
            --exclude src/lib/fdt --exclude src/lib/uuid \
            --exclude src/arch/host --exclude src/plat/host --exclude src/board/host \
            --html-details coverage/index.html --print-summary

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          fail_ci_if_error: false

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [jiffy, imx8dxlevk, imx8mevk, imx8mpevk]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/pbdev firmware ${{ matrix.board }}

  coverity:
    name: Coverity scan
    # Needs the COVERITY_SCAN_TOKEN secret, which is not available on forks
    if: github.repository == 'jonasblixt/punchboot' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Coverity Build Tool
        run: |
          wget -q https://scan.coverity.com/download/cxx/linux64 --post-data "token=$TOKEN&project=jonpe960%2Fpunchboot" -O cov-analysis-linux64.tar.gz
          mkdir cov-analysis-linux64
          tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}

      - name: Build with cov-build
        run: |
          scripts/pbdev run bash -c '
            export PATH=$PWD/cov-analysis-linux64/bin:$PATH
            cov-configure --template --compiler arm-none-eabi-gcc --comptype gcc
            cov-build --dir cov-int scripts/ci/build-firmware.sh jiffy'

      - name: Submit the result to Coverity Scan
        run: |
          tar czvf pb.tgz cov-int
          curl \
            --form project=jonpe960%2Fpunchboot \
            --form token=$TOKEN \
            --form email=jonpe960@gmail.com \
            --form file=@pb.tgz \
            --form version=master \
            --form description="punchboot" \
            https://scan.coverity.com/builds?project=jonpe960%2Fpunchboot
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
