[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "punchboot"
dynamic = ["version"]
description = "Punchboot tools"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Blixt", email = "jonas@blxt.se" }]
requires-python = ">=3.10"
dependencies = [
    "semver>=3,<4",
    "click>=8.2,<9",
    "pyusb>=1.2,<2",
    # libusb for pyusb, without it pyusb looks for the system's
    "libusb-package>=1.0.26",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/jonasblixt/punchboot"

[project.scripts]
punchboot = "punchboot.__main__:cli"

[tool.setuptools]
packages = ["punchboot"]
package-dir = { punchboot = "tools/punchboot" }

[tool.setuptools.package-data]
punchboot = ["py.typed"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.ruff]
line-length = 100
extend-exclude = [
    "pki",
    "doc",
    "scripts/**",
]
target-version = "py310"

[tool.ruff.lint]
# See: https://docs.astral.sh/ruff/rules/ for details
select = ["ALL"]
ignore = [
    "COM812",   # Conflicts with the formatter
    "ISC001",   # Conflicts with the formatter
    "PLE0605",  # ruff does not handle += in __all__
    "FBT",      # don't care for these at the moment
    "CPY001",   # Copyright notices are not used in the python sources
    "PT001",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
]

pyupgrade.keep-runtime-typing = true

pylint.max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # pytest uses plain asserts
    "D103",     # test functions are documented by their names
    "D104",
    "PLR2004",  # expected values in tests are fine inline
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
warn_return_any = true
exclude = [
    "^build.*",
    "^doc.*",
    "^scripts/menuconfig\\.py$",
    "^scripts/olddefconfig\\.py$"
]

# pyusb and libusb-package have no type information
[[tool.mypy.overrides]]
module = ["usb", "usb.*", "libusb_package"]
ignore_missing_imports = true
