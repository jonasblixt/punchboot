[tool.ruff]
line-length = 100
extend-exclude = [
    "pki",
    "doc",
    "scripts/**",
]
target-version = "py310"

[tool.ruff.lint]
# See: https://docs.astral.sh/ruff/rules/ for details
select = ["ALL"]
ignore = [
    "COM812",   # Conflicts with the formatter
    "ISC001",   # Conflicts with the formatter
    "PLE0605",  # ruff does not handle += in __all__
    "FBT",      # don't care for these at the moment
    "CPY001",   # Copyright notices are not used in the python sources
    "PT001",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
]

pyupgrade.keep-runtime-typing = true

pylint.max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # pytest uses plain asserts
    "D103",     # test functions are documented by their names
    "D104",
    "PLR2004",  # expected values in tests are fine inline
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
warn_return_any = true
exclude = [
    "^build.*",
    "^doc.*",
    "^scripts/menuconfig\\.py$",
    "^scripts/olddefconfig\\.py$"
]

# pyusb and libusb-package have no type information
[[tool.mypy.overrides]]
module = ["usb", "usb.*", "libusb_package"]
ignore_missing_imports = true
