#
# OpenOCD config for the i.MX RT10xx: one Cortex-M7 over SWD. Sourced from
# the board's openocd.cfg, which sets PB_ENTRY (pb's vector table). Use
# scripts/pbdebug rather than running this directly.
#

transport select swd
adapter speed 4000

swd newdap imxrt cpu -expected-id 0x0bd11477
dap create imxrt.dap -chain-position imxrt.cpu
target create imxrt.cpu cortex_m -dap imxrt.dap
cortex_m reset_config sysresetreq

gdb_breakpoint_override hard

imxrt.cpu configure -event gdb-attach { halt }
imxrt.cpu configure -event gdb-detach { resume }

proc imxrt_read_word { addr } {
    return [lindex [read_memory $addr 32 1] 0]
}

# Get the chip into the state the boot ROM leaves it in when it starts a boot
# image (clocks, watchdogs), by letting it boot the image in FlexSPI NOR and
# stopping it at the image's reset handler. The IVT at 0x60001000 (RM 9.7.1)
# points to the image's vector table: in the NOR for an image that runs from
# there, else in RAM, where the ROM copies the image (pb), with the IVT at
# 'self'. It's read before the reset, while the FlexSPI is still set up by
# whatever runs, so there must be a boot image in the NOR.
proc pb_load_prepare { } {
    halt
    set ivt 0x60001000
    set vectors [imxrt_read_word [expr {$ivt + 4}]]
    set self [imxrt_read_word [expr {$ivt + 0x14}]]
    if { ([imxrt_read_word $ivt] & 0xff) != 0xd1 } {
        resume
        error "pb_load_prepare: no boot image in the FlexSPI NOR (no IVT at 0x60001000)"
    }
    if { $vectors >= 0x60000000 && $vectors < 0x70000000 } {
        set reset [imxrt_read_word [expr {$vectors + 4}]]
    } else {
        set reset [imxrt_read_word [expr {$ivt + $vectors + 4 - $self}]]
    }
    set entry [expr {$reset & ~1}]
    reset halt
    bp $entry 2 hw
    resume
    wait_halt 5000
    rbp $entry
}

# After the load: start at pb's vector table, its stack and reset handler
proc pb_load_start { } {
    global PB_ENTRY
    set stack [imxrt_read_word $PB_ENTRY]
    # sp is the active stack pointer, which is msp after a reset; set both, so
    # neither cached copy is written back over the other
    reg msp $stack
    reg sp $stack
    reg pc [expr {[imxrt_read_word [expr {$PB_ENTRY + 4}]] & ~1}]
    # VTOR
    mww 0xe000ed08 $PB_ENTRY
}

# OpenOCD prints the result of the last command in a config file
return
