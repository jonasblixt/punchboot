#
# OpenOCD target for the i.MX6UL. A board's openocd.cfg sources this after an
# adapter config. Use scripts/pbdebug rather than running this directly.
#

# The upstream target expects DAP r4 (0x4ba00477), the silicon reports r5
if { ![info exists DAP_TAPID] } {
    set DAP_TAPID 0x5ba00477
}

source [find target/imx6ul.cfg]

adapter speed 1000

# pb maps .text read-only with LPAE tables (no domains, so 'dacrfixup' doesn't
# help), and a software breakpoint set before the MMU is on can't be removed
# again. The A7 has 6 hardware breakpoints.
gdb_breakpoint_override hard

imx6ul.cpu configure -event gdb-attach { halt }
# OpenOCD leaves the target halted when GDB goes away
imx6ul.cpu configure -event gdb-detach { resume }

# Run the DCD (the DATA lines of an imximage.cfg) the way the boot ROM does,
# so that DDR is usable before loading an image over JTAG.
proc imx6ul_dcd { file } {
    set fd [open $file r]
    while { [gets $fd line] >= 0 } {
        set line [string trim [regsub {#.*} $line {}]]
        if { $line eq "" } {
            continue
        }
        set words [regexp -all -inline {\S+} $line]
        switch -- [lindex $words 0] {
            IMAGE_VERSION - BOOT_FROM - CSF {}
            DATA {
                if { [lindex $words 1] != 4 } {
                    close $fd
                    error "imx6ul_dcd: only 32-bit DATA is supported: $line"
                }
                mww [lindex $words 2] [lindex $words 3]
            }
            default {
                close $fd
                error "imx6ul_dcd: unsupported DCD command: $line"
            }
        }
    }
    close $fd
}

# Prepare for loading an image over JTAG, 'monitor pb_load_prepare' from GDB
# before 'load' (see scripts/pbdebug --load). The core must be in the boot ROM
# with the MMU and D-cache off, e.g. in the serial downloader: pb doesn't
# invalidate the caches before enabling them, so lines left by a running image
# could later be written back over the new one.
proc pb_load_prepare { } {
    halt
    set sctlr [arm mrc 15 0 1 0 0]
    if { $sctlr & 0x5 } {
        resume
        error [format "pb_load_prepare: MMU or D-cache is on (SCTLR = 0x%08x), load from the boot ROM" $sctlr]
    }
    # I-cache off and invalidated, ARM state, SVC mode with IRQ, FIQ and aborts masked
    arm mcr 15 0 1 0 0 [expr {$sctlr & ~0x1000}]
    arm mcr 15 0 7 5 0 0
    reg cpsr 0x1d3
    if { [llength [info procs pb_board_load_prepare]] } {
        pb_board_load_prepare
    }
}
