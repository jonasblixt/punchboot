#
# OpenOCD board config for the i.MX RT1060 EVK. Use scripts/pbdebug rather
# than running this directly. The EVK's on-board debug probe runs SEGGER's
# J-Link firmware (1366:1024), its serial port is the console (LPUART1).
#
# adapter: interface/jlink.cfg
#

# PB_ENTRY in makefile.mk
set PB_ENTRY 0x20249000

source [find src/plat/imxrt/openocd.cfg]

# OpenOCD prints the result of the last command in a config file
return
