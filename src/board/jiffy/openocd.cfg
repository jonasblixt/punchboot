#
# OpenOCD board config for jiffy. Use scripts/pbdebug rather than running this
# directly.
#

source [find src/plat/imx6ul/openocd.cfg]

# No reset_config: an SRST reset leaves this board in the boot ROM's serial
# downloader instead of booting from eMMC.

# Set up DDR from the boot image DCD, e.g. 'monitor jiffy_ddr_init' when
# halted in the boot ROM
proc jiffy_ddr_init { } {
    imx6ul_dcd [find src/board/jiffy/imximage.cfg]
}
