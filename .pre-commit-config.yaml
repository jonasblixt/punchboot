exclude: ^(src/plat/imx8x/sci|include/plat/imx8x/sci)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-json
    - id: check-merge-conflict
    - id: check-shebang-scripts-are-executable
    - id: check-yaml
    - id: end-of-file-fixer
    - id: forbid-submodules
    - id: requirements-txt-fixer
    - id: trailing-whitespace

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    additional_dependencies:
      - "semver>=3,<4"
      - "click>=8.2,<9"
      - "pytest"
    pass_filenames: false # This and the args, argument are needed to make mypy read pyproject.toml
    args: ["."]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff-check
    args: [ --fix ]

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.3
  hooks:
  - id: clang-format
    exclude: (src/boot/atf-interface/)

- repo: local
  hooks:
  - id: compat-abi-only-grows
    name: tests/compat/abi.txt only grows (D-008)
    entry: python tests/compat/check_abi.py history tests/compat/abi.txt --against HEAD
    language: python
    files: ^tests/compat/abi\.txt$
    pass_filenames: false
